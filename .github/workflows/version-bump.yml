name: Release Label Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

jobs:
  validate-release-label:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate release label
        run: |
          count=0
          bump=""

          for label in ${{ join(github.event.pull_request.labels.*.name, ' ') }}; do
            case "$label" in
              v-patch|v-minor|v-major)
                count=$((count + 1))
                bump="$label"
                ;;
            esac
          done

          if [ "$count" -eq 0 ]; then
            echo "::error::Add exactly one release label to this PR: v-patch, v-minor, or v-major."
            exit 1
          fi

          if [ "$count" -gt 1 ]; then
            echo "::error::This PR has multiple release labels. Keep only one of v-patch, v-minor, or v-major."
            exit 1
          fi

          echo "Release label is $bump"
