name: Bump version on PR label

on:
  pull_request:
    types: [labeled]

jobs:
  bump-version:
    if: |
      github.event.label.name == 'v-patch' ||
      github.event.label.name == 'v-minor' ||
      github.event.label.name == 'v-major'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine bump type
        id: bump
        run: |
          case "${{ github.event.label.name }}" in
            v-patch) echo "type=patch" >> $GITHUB_OUTPUT ;;
            v-minor) echo "type=minor" >> $GITHUB_OUTPUT ;;
            v-major) echo "type=major" >> $GITHUB_OUTPUT ;;
          esac

      - name: Bump version in package.json
        run: npm version ${{ steps.bump.outputs.type }} --no-git-tag-version

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION"
          git push
