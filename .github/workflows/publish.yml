name: Publish to npm

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  release-metadata:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      bump-type: ${{ steps.bump.outputs.type }}
    steps:
      - name: Determine bump type
        id: bump
        run: |
          count=0

          for label in ${{ join(github.event.pull_request.labels.*.name, ' ') }}; do
            case "$label" in
              v-patch)
                count=$((count + 1))
                bump="patch"
                ;;
              v-minor)
                count=$((count + 1))
                bump="minor"
                ;;
              v-major)
                count=$((count + 1))
                bump="major"
                ;;
            esac
          done

          if [ "$count" -ne 1 ]; then
            echo "::error::Merged PR must have exactly one release label: v-patch, v-minor, or v-major."
            exit 1
          fi

          echo "type=$bump" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: release-metadata
    uses: ./.github/workflows/build-and-test.yml

  publish:
    needs: [release-metadata, build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Bump version
        run: npm version ${{ needs.release-metadata.outputs.bump-type }} --no-git-tag-version

      - name: Check version is not already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view cypress-visual-eval@$VERSION version 2>/dev/null | grep -q "$VERSION"; then
            echo "::error::Version $VERSION is already published on npm."
            exit 1
          fi
          echo "Publishing version $VERSION"

      - name: Commit version bump
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release $VERSION"
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "npm release v$VERSION"
